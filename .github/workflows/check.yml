name: Shopee Stock Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# 必须开启写入权限才能把 json 推送到仓库
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Stock Check
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python monitor.py  # 如果你的文件名是 main.py，这里就写 python main.py

      - name: Commit and Push stock_state.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stock_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update stock state" && git push)
