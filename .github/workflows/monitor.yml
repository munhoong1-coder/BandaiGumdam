name: Shopee Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:


jobs:
  check:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install
      run: |
        pip install -r requirements.txt


    - name: Run Bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}

      run: |
        python monitor.py
